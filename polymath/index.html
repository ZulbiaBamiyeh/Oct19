<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polymath</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="pm:share-url" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Cyanotype: the blueprint-blue of Anna Atkins' 1840s botanical photograms, white "exposed" lines,
   an amber highlighter for you and pale cyan for your opponent. One committed look in every theme. */
:root {
  --paper: #0d3150;
  --deep: #0a2741;
  --panel: #12406a;
  --line: #2f6191;
  --ink: #eef5fb;
  --muted: #a3bfd6;
  --you: #ffc857;
  --opp: #8fd8ff;
  --good: #5fd393;
  --bad: #ff8070;
  --on-bright: #0a2741;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(color-mix(in srgb, var(--ink) 5%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, var(--ink) 5%, transparent) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font: 400 1rem/1.45 var(--display);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 520px; margin: 0 auto; padding-block: 16px 32px; display: flex; flex-direction: column; gap: 16px; min-height: 100%; }
h1, h2, h3 { margin: 0; line-height: 1.1; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
.label { font: 600 0.7rem/1.2 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; }
.btn-you { background: var(--you); color: var(--on-bright); }
.btn-line { background: transparent; border: 1.5px solid var(--line); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.muted { color: var(--muted); }

/* Home */
.masthead { display: grid; gap: 6px; padding-top: 8px; }
.masthead h1 { font-size: clamp(2.6rem, 11vw, 3.6rem); font-weight: 800; letter-spacing: -0.03em; font-variation-settings: "opsz" 96; }
.masthead p { margin: 0; color: var(--muted); max-width: 40ch; }
.banner { border: 1.5px dashed var(--you); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.banner p { margin: 0; }
.topics { display: grid; gap: 10px; }
.topic {
  display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; text-align: left;
  background: var(--deep); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px;
  transition: border-color 0.15s, transform 0.15s;
}
.topic:hover { border-color: var(--ink); transform: translateY(-1px); }
.topic svg { width: 44px; height: 44px; stroke: var(--ink); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.topic h2 { font-size: 1.15rem; font-weight: 700; }
.topic .blurb { color: var(--muted); font-size: 0.9rem; }
.topic .stats { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; font: 0.75rem/1.3 var(--mono); color: var(--muted); }
.topic .stats b { color: var(--you); font-weight: 600; }
.topic .go { font: 600 0.8rem var(--mono); color: var(--you); }
.footnote { font-size: 0.85rem; color: var(--muted); margin: 0; }

/* VS intro */
.vs { display: grid; gap: 20px; justify-items: center; text-align: center; padding-top: 12vh; }
.vs .pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; width: 100%; }
.vs .x { font: 800 2rem var(--display); color: var(--muted); }
.player-card { display: grid; justify-items: center; gap: 8px; min-width: 0; }
.player-card .name { font-weight: 700; overflow-wrap: anywhere; }
.avatar { width: 64px; height: 64px; border-radius: 50%; border: 3px solid currentColor; object-fit: cover; display: grid; place-items: center; font: 800 1.4rem var(--display); background: var(--deep); }
.avatar.small { width: 36px; height: 36px; border-width: 2px; font-size: 0.9rem; }
.you { color: var(--you); }
.opp { color: var(--opp); }
.tag { font: 600 0.7rem var(--mono); letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px; }

/* Round */
.board { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.side.right { flex-direction: row-reverse; text-align: right; }
.side .who { min-width: 0; }
.side .who .name { font-size: 0.85rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side .score { font: 600 1.5rem/1 var(--mono); }
.side .answered { font: 0.7rem var(--mono); color: var(--muted); min-height: 1em; }
.round-no { text-align: center; }
.round-no .mono { font-size: 1.1rem; }
.arena { display: grid; grid-template-columns: 10px 1fr 10px; gap: 12px; align-items: stretch; }
.meter { background: var(--deep); border-radius: 999px; position: relative; overflow: hidden; min-height: 280px; }
.meter i { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; border-radius: 999px; transition: height 0.6s cubic-bezier(.2,.8,.2,1); }
.meter.you i { background: var(--you); }
.meter.opp i { background: var(--opp); }
.qcard { display: grid; gap: 14px; align-content: start; min-width: 0; }
.timer { height: 6px; background: var(--deep); border-radius: 999px; overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--ink); transform-origin: left; }
.question { font-size: clamp(1.25rem, 5vw, 1.55rem); font-weight: 700; line-height: 1.2; text-wrap: balance; }
.final { color: var(--you); }
.choices { display: grid; gap: 8px; }
.choice {
  position: relative; text-align: left; background: var(--deep); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 12px 14px; font-weight: 600; min-height: 52px; overflow-wrap: anywhere;
}
.choice:not(:disabled):hover { border-color: var(--ink); }
.choice:disabled { cursor: default; }
.choice.correct { background: color-mix(in srgb, var(--good) 22%, var(--deep)); border-color: var(--good); }
.choice.wrong { background: color-mix(in srgb, var(--bad) 22%, var(--deep)); border-color: var(--bad); }
.choice .marks { position: absolute; top: -9px; right: 10px; display: flex; gap: 4px; }
.choice .mark { font: 600 0.65rem var(--mono); padding: 1px 6px; border-radius: 999px; color: var(--on-bright); }
.choice .mark.you { background: var(--you); }
.choice .mark.opp { background: var(--opp); }
.fact { border-left: 3px solid var(--you); padding: 2px 0 2px 12px; margin: 0; color: var(--ink); }
.fact .label { display: block; margin-bottom: 2px; }
.points { font: 600 0.9rem var(--mono); }
.next-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

/* Result */
.result { display: grid; gap: 16px; }
.result h1 { font-size: clamp(2.2rem, 10vw, 3rem); font-weight: 800; letter-spacing: -0.02em; }
.final-score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center; }
.final-score .num { font: 600 2.4rem/1 var(--mono); }
.breakdown { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.breakdown td { padding: 7px 4px; border-top: 1px solid var(--line); vertical-align: top; }
.breakdown td.n { width: 2ch; color: var(--muted); }
.breakdown td.p { width: 4.5ch; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.breakdown .miss { color: var(--bad); }
.note { margin: 0; font-size: 0.85rem; color: var(--muted); }

.toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--on-bright); padding: 8px 14px; border-radius: 999px; font-weight: 700; z-index: 20; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
